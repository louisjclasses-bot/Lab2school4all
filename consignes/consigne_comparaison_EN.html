<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consignes</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  /* Mise en forme adaptée dys : Arial 20, lettres espacées, interligne double */
  body { padding: 2px 10px 10px 2px; overflow: hidden; color: #2b2b2b;
         font-family: Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 20px;
         letter-spacing: 0.1em; line-height: 2; }
  .row { display: flex; flex-wrap: nowrap; gap: 24px; align-items: flex-start; text-align: left; }
  .txt { flex: 1 1 auto; min-width: 0; }
  .txt p, .txt ol { margin: 0 0 0.3em; }
  .txt ol { padding-left: 1.6em; }
  .titre { font-size: 1.2em; line-height: 1.5; margin-bottom: 0.4em !important; }
  .gif { flex: 0 0 auto; width: 600px; max-width: 60%; }
  .gif img { display: block; width: 100%; height: auto; border: 1px solid #bfc5cc; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
</style>
</head>
<body>
<div class="row">
<div class="txt"><p class="titre"><strong>Comparing adaptations</strong></p><p>Several pairs of versions of the same exercise.</p><p><strong>Still in the shoes of a child with DCD, choose the most effective one.</strong></p><p>Click on the image you choose (blue outline), then move on to the next pair.</p><p>No right or wrong answers.</p></div>
<div class="gif"><img src="../demos/demo_consigne_comparaison_EN.gif" alt="Demonstration animation"></div>
</div>
<script>
  // Si le contenu dépasse la hauteur du cadre, on rétrécit le GIF (la colonne de texte s'élargit)
  // sans jamais toucher à la taille du texte. En dernier recours, défilement dans le cadre.
  function ajuster() {
    var g = document.querySelector('.gif'), w = 600;
    g.style.width = w + 'px';
    document.body.style.overflow = 'hidden';
    while (document.documentElement.scrollHeight > window.innerHeight && w > 360) {
      w -= 20; g.style.width = w + 'px';
    }
    if (document.documentElement.scrollHeight > window.innerHeight) document.body.style.overflow = 'auto';
  }
  var img = document.querySelector('.gif img');
  if (img.complete) ajuster(); else img.addEventListener('load', ajuster);
  window.addEventListener('resize', ajuster);
</script>
</body>
</html>
